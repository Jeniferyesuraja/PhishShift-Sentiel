services:
  - type: web
    name: phishshift
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.wsgi:app --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /healthz
