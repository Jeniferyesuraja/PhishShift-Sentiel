<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PhishShift Sentinel icon">
  <defs>
    <linearGradient id="shieldGrad" x1="32" y1="18" x2="224" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12306B"/>
      <stop offset="100%" stop-color="#071226"/>
    </linearGradient>
    <linearGradient id="shieldRim" x1="34" y1="14" x2="222" y2="241" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="envStroke" x1="76" y1="88" x2="180" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="68" y1="138" x2="188" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(165,243,252,0)"/>
      <stop offset="50%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="rgba(165,243,252,0)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020B16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <ellipse cx="128" cy="134" rx="96" ry="90" fill="url(#glow)" opacity="0.75"/>

    <path d="M128 14 L222 50 V121 C222 176 183 217 128 241 C73 217 34 176 34 121 V50 Z" fill="url(#shieldGrad)"/>
    <path d="M128 14 L222 50 V121 C222 176 183 217 128 241 C73 217 34 176 34 121 V50 Z" fill="none" stroke="url(#shieldRim)" stroke-width="5"/>
    <path d="M128 26 L205 58 V119 C205 166 173 198 128 219 C83 198 51 166 51 119 V58 Z" fill="none" stroke="#A5F3FC" stroke-opacity="0.22" stroke-width="2"/>

    <path d="M94 96 L142 146 L190 96" fill="none" stroke="#FB7185" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" transform="translate(14 10)"/>
    <path d="M82 102 L142 158 L202 102" fill="none" stroke="#FB7185" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" transform="translate(14 10)"/>

    <g>
      <rect x="63" y="82" width="130" height="90" rx="12" fill="#0B1F45" stroke="url(#envStroke)" stroke-width="6"/>
      <path d="M75 94 L128 138 L181 94" fill="none" stroke="url(#envStroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M75 94 V174 H181 V94" fill="none" stroke="url(#envStroke)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g filter="url(#softGlow)">
      <line x1="68" y1="138" x2="188" y2="138" stroke="url(#scanBeam)" stroke-width="3" opacity="0.9"/>
    </g>

    <circle cx="186" cy="176" r="21" fill="#071226" stroke="#67E8F9" stroke-width="3"/>
    <path d="M176 177 L184 186 L198 167" fill="none" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
